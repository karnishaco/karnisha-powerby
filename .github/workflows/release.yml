name: Build release ZIP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches tag
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' karnisha-powerby.php | awk '{print $NF}')
          CONST=$(grep -m1 "KPB_VERSION" karnisha-powerby.php | sed -E "s/.*'([0-9][^']*)'.*/\1/")
          STABLE=$(grep -m1 -i '^Stable tag:' readme.txt | awk '{print $NF}')
          echo "tag=$TAG header=$HEADER const=$CONST stable=$STABLE"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONST" ] || [ "$TAG" != "$STABLE" ]; then
            echo "::error::Version mismatch (tag $TAG, header $HEADER, KPB_VERSION $CONST, Stable tag $STABLE)"
            exit 1
          fi

      - name: PHP syntax check
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build ZIP
        run: git archive --format=zip --prefix=karnisha-powerby/ -o karnisha-powerby.zip HEAD

      - name: Attach ZIP to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" karnisha-powerby.zip --clobber

      - name: Upload ZIP as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: karnisha-powerby
          path: karnisha-powerby.zip
